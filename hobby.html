            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        /* 弹窗里的大图 */
        #modalImg {
            max-width: 90%;
            max-height: 90%;

  background: linear-gradient(120deg, #f5fafa 0%, #e4f1f2 100%);

<!-- 视频区域：默认显示封面+播放按钮 -->
<div style="margin: 20px 0;">
    <h3 style="text-indent: 2em;">篮球活动视频</h3>
    <!-- 视频容器：用于点击触发播放 -->
    <div id="videoContainer1" style="position: relative; cursor: pointer; width: 600px; height: 340px; background-color: #000;">
        <!-- 视频元素：默认不自动播放 -->
        <video id="myVideo1" width="600" height="340" controls style="display: none;">
            <source src="basketball_video.mp4" type="video/mp4">
            你的浏览器不支持HTML5视频播放
        </video>
        <!-- 自定义播放按钮（默认显示） -->
        <div id="playBtn1" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 60px; color: #fff;">▶</div>
    </div>
</div>

<script>
    // 获取元素
    const videoContainer1 = document.getElementById('videoContainer1');
    const myVideo1 = document.getElementById('myVideo1');
    const playBtn1 = document.getElementById('playBtn1');

    // 点击容器触发播放
    videoContainer1.addEventListener('click', function() {
        if (myVideo1.paused) {
            // 显示视频控件，隐藏播放按钮，开始播放
            myVideo1.style.display = 'block';
            playBtn1.style.display = 'none';
            myVideo1.play();
        } else {
            // 暂停视频
            myVideo1.pause();
        }
    });
</script>
